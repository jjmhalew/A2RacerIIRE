# Builds A2RacerRE.exe with build.bat (Windows), a2racerre with build.sh (Linux / Steam Deck, SDL2) and the Android APK
# (android/, Gradle) on every push and pull request (no game data involved: the programs hold only the port's own code).
# A pushed tag v* also publishes a GitHub release with A2RacerRE-<tag>.zip (A2RacerRE.exe, README.md, LICENSE),
# A2RacerRE-<tag>-linux-x86_64.tar.gz (a2racerre, README.md, LICENSE) and A2RacerRE-<tag>.apk.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Check the exe
        shell: pwsh
        run: |
          $v = (Get-Item A2RacerRE.exe).VersionInfo
          "A2RacerRE.exe: $((Get-Item A2RacerRE.exe).Length) bytes, $($v.ProductName) $($v.FileVersion)"
          # a release tag must match res/a2racerre.rc (the exe's and the APK's version): v1.2.3 = "1.2.3"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($v.ProductVersion)") {
            "::error::tag $env:GITHUB_REF_NAME does not match the version in res/a2racerre.rc ($($v.ProductVersion))"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "A2RacerRE-$env:GITHUB_REF_NAME" } else { "A2RacerRE-$($env:GITHUB_SHA.Substring(0, 7))" }
          New-Item -ItemType Directory -Force "pkg/$name" | Out-Null
          Copy-Item A2RacerRE.exe, README.md, LICENSE "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: A2RacerRE-windows
          path: ${{ env.ZIP }}

  # Ubuntu 22.04: glibc 2.35 and SDL 2.0.20, so the binary also runs on older distributions and on SteamOS.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev

      - name: Build
        run: sh build.sh a2racerre && ls -l a2racerre && ldd a2racerre

      - name: Tests without game data
        run: sh tests/run.sh

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="A2RacerRE-$GITHUB_REF_NAME"; else name="A2RacerRE-${GITHUB_SHA:0:7}"; fi
          mkdir -p "pkg/$name" && cp a2racerre README.md LICENSE "pkg/$name/"
          tar -C pkg -czf "$name-linux-x86_64.tar.gz" "$name"
          echo "TGZ=$name-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: A2RacerRE-linux
          path: ${{ env.TGZ }}

  # Android: arm64 phones and tablets, x86_64 for the emulator and Chromebooks. CMake fetches SDL 2.32.10. Signed with
  # the release key of the repository secrets ANDROID_KEYSTORE_B64 (the keystore, base64), ANDROID_KEY_ALIAS and
  # ANDROID_KEY_PASSWORD when they are set; without them the APK carries the runner's debug key, which changes from
  # run to run, so such an APK may not install over the one before it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/a2.jks"
            export ORG_GRADLE_PROJECT_a2Keystore="$RUNNER_TEMP/a2.jks" ORG_GRADLE_PROJECT_a2KeyAlias="$KEY_ALIAS" ORG_GRADLE_PROJECT_a2KeyPassword="$KEY_PASSWORD"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::warning::no ANDROID_KEYSTORE_B64 secret: this release APK is signed with the runner's debug key and may not install over an earlier one"
          fi
          gradle assembleRelease --console=plain

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="A2RacerRE-$GITHUB_REF_NAME"; else name="A2RacerRE-${GITHUB_SHA:0:7}"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$name.apk" && ls -l "$name.apk"
          echo "APK=$name.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: A2RacerRE-android
          path: ${{ env.APK }}

  # The release notes: the annotated tag's message, then how to start.
  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          new=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e 's/[[:space:]]*$//')
          start="Windows: unzip, start A2RacerRE.exe and point it to your A2 Racer II CD (or a mounted ISO image of it). Linux / Steam Deck: unpack the .tar.gz and start a2racerre (needs SDL2). Android: install the .apk and choose your ISO image or a copy of the CD at the first start. The game files are not included - see README.md."
          if [ -n "$new" ]; then printf '%s\n\n%s\n' "$new" "$start" > notes.md; else printf '%s\n' "$start" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "A2RacerRE $GITHUB_REF_NAME" --notes-file notes.md
